    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      const appearanceStorageKey = 'biblioteca-filosofia-appearance'
      try {
        const savedAppearance =
          window.localStorage.getItem(appearanceStorageKey)
        document.documentElement.dataset.theme =
          savedAppearance === 'dark' ? 'dark' : 'light'
      } catch (error) {
        document.documentElement.dataset.theme = 'light'
        document.documentElement.dataset.appearanceStorageError = 'true'
        console.error('No se pudo recuperar la apariencia guardada.', error)
      }
    </script>
